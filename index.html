<style>
  :root {
    --bg: #111;
    --panel: #1a1a1a;
    --line: #2a2a2a;
    --line-strong: #444;
    --text: #eee;
    --muted: #999;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid #333; }
  .top { padding: 16px 16px 10px; }
  h1 { margin: 0 0 12px; font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    padding: 10px 18px; border: 1px solid var(--line-strong); background: #1c1c1c;
    color: var(--text); cursor: pointer; border-radius: 8px; font-size: 14px;
    transition: border-color .15s, background .15s, color .15s;
  }
  button:hover { border-color: #888; }
  button.active { background: #fff; color: #000; border-color: #fff; }
  button.empty { opacity: .38; }
  .count { opacity: .6; margin-left: 6px; }
  #modeNav { margin-bottom: 12px; }
  #modeNav button { font-weight: 600; }
  #outerNav { margin-bottom: 4px; }
  #crumb { opacity: .7; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; padding: 8px 16px 8px; color: var(--muted); }
  #innerNav { padding: 0 16px 12px; border-top: 1px solid #222; padding-top: 12px; }
  #innerNav button { padding: 7px 12px; font-size: 13px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #222; }
  .card .info { padding: 10px; font-size: 13px; }
  .card .title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .price { margin-top: 4px; opacity: .7; }
  .empty-msg { padding: 48px 16px; color: var(--muted); text-align: center; grid-column: 1 / -1; }
  :root { color-scheme: dark; --bg: #121513; --panel: #1b201d; --line: #303932; --text: #eff2e9; --muted: #a5b1a6; }
  body { max-width: 1800px; margin: auto; }
  header { position: static; border-color: var(--line); }
  .top { padding: 32px 28px 20px; }
  h1 { font-size: 30px; letter-spacing: -1px; margin-bottom: 8px; }
  .intro, #description { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 800px; }
  .intro { margin: 0 0 24px; }
  #description { margin: 0 0 22px; min-height: 45px; }
  #modeNav { margin-bottom: 18px; gap: 6px; }
  button { background: transparent; border-color: var(--line); border-radius: 6px; }
  button.active { background: #d8e9b4; border-color: #d8e9b4; color: #182014; }
  button:focus-visible { outline: 2px solid #d8e9b4; outline-offset: 4px; }
  #modeNav button { padding: 12px 16px; }
  #crumb { padding: 16px 28px; border-top: 1px solid var(--line); opacity: 1; line-height: 1.6; }
  #innerNav { padding: 0 28px 20px; border: 0; }
  #grid { padding: 24px 28px 40px; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .card { border-radius: 6px; }
  .card img { object-fit: contain; background: #ecece8; }
  .card .info { padding: 14px; line-height: 1.5; }
  .card .title { min-height: 39px; }
  .card .price { color: var(--muted); opacity: 1; }
  @media (max-width: 600px) {
    .top { padding: 24px 16px 16px; }
    #modeNav { display: grid; grid-template-columns: 1fr 1fr; }
    button { padding: 9px 12px; font-size: 13px; }
    #crumb { padding: 12px 16px; }
    #innerNav { padding: 0 16px 16px; }
    #grid { padding: 16px; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card .info { padding: 10px; }
  }
</style>
</head>

,{"title":"P3 Round - SP-01 ~ Black/Green","price":"375.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/files/3S-02FEB24-SUNGLASSES-TYPE-2-BLACK-FRONT_5e03cef8-c0f1-4eb7-bc3d-2307b948e9cc.jpg?v=1722973356","bucket":"7","style":"minimal"},{"title":"Shipping Protection by Route","price":"0.98","image":"https://cdn.shopify.com/s/files/1/0028/6132/files/route-package-protection-logo-v3.png?v=1742414106","bucket":"7","style":"minimal"},{"title":"Trail Cap ~ Tan Nylon","price":"45.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/files/3S-08AUG23-HAT-BROWN-FRONT.jpg?v=1693936197","bucket":"7","style":"earthy"},{"title":"Gift Card","price":"50.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/3sixteenGiftCard_new.jpg?v=1590156010","bucket":"7","style":"outdoor"},{"title":"Tochigi Leather Belt - Natural","price":"198.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/3s-Belt-Natural-1.jpg?v=1668706777","bucket":"7","style":"earthy"},{"title":"Tochigi Leather Belt - Black","price":"198.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/3s-Belt-Black-1.jpg?v=1668707301","bucket":"7","style":"outdoor"},{"title":"Tochigi Leather Belt - Chestnut","price":"198.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/3s-Belt-Brown-1.jpg?v=1668707306","bucket":"7","style":"americana"},{"title":"Enamel Pin ~ Union Special","price":"12.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/UnionSpecialPin.jpg?v=1484267132","bucket":"7","style":"earthy"},{"title":"Smiley Cap ~ Earth HBT","price":"65.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/DoubleSmiley-1.jpg?v=1590022074","bucket":"7","style":"earthy"},{"title":"Enamel Pin ~ 3s White","price":"12.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/GoldWhitePin.jpg?v=1607788668","bucket":"7","style":"knit"},{"title":"Enamel Pin ~ 3s Black","price":"12.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/Black3sPin.jpg?v=1607788599","bucket":"7","style":"outdoor"},{"title":"Zip Wallet ~ Natural Cowhide","price":"130.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/Wallet-34-1.jpg?v=1612465672","bucket":"7","style":"earthy"},{"title":"Zip Wallet ~ Black Cowhide","price":"130.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/Wallet-34-Black-1.jpg?v=1612465751","bucket":"7","style":"minimal"},{"title":"Zip Pouch ~ Black Cowhide","price":"120.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/Wallet-Zip-Black1.jpg?v=1612466048","bucket":"7","style":"minimal"},{"title":"Zip Pouch ~ Natural Cowhide","price":"120.00","image":"https://cdn.shopify.com/s/files/1/0028/6132/products/Wallet-Zip-2.jpg?v=1612466116","bucket":"7","style":"earthy"}];
const NAMES = ["Workwear", "Artisanal", "Americana", "Earthy", "Minimal", "Graphic", "Knit", "Outdoor"];
const STYLES = ["workwear", "artisanal", "americana", "earthy", "minimal", "graphic", "knit", "outdoor"];

const modeNav = document.getElementById('modeNav');
const outerNav = document.getElementById('outerNav');
const innerNav = document.getElementById('innerNav');
const crumb = document.getElementById('crumb');
const grid = document.getElementById('grid');

const MODES = [
  { id: 'image-text', label: 'Cluster → Vibe', description: 'Original v0 visual clusters, filtered by saved predicted vibe. With All selected, each bucket has exactly the same items and order as v0. Vibes come from image embeddings compared with text prompts.' },
  { id: 'text', label: 'Vibes', description: 'The original collection grouped only by saved predicted vibe, without cluster filters. assign.py compares image embeddings with text prompts after centering within clothing types. Labels are predictions, not verified styles.' },
  { id: 'text-image', label: 'Vibe → Cluster', description: 'Saved vibe assignments grouped by vibe first, then by original v0 cluster. These are the same cluster memberships used in Cluster → Vibe and v0; reversing the filters does not run a different model.' },
  { id: 'v0', label: 'v0 · Original', description: 'The exact saved buckets and item order from the v0 branch: normalized image embeddings grouped with 8-cluster k-means. Cluster → Vibe adds vibe filters to these same buckets.' }
];

let mode = 'image-text';
let outer = null;
let inner = null;

const V0_ITEMS = Object.entries(V0_BUCKETS).flatMap(([bucket, items]) => items.map(item => ({ ...item, bucket })));
const vibeByImage = new Map(ITEMS.map(item => [item.image, item.style]));
const vibeByTitle = new Map(ITEMS.map(item => [item.title, item.style]));
const CLUSTER_ITEMS = V0_ITEMS.map(item => ({
  ...item,
  style: vibeByImage.get(item.image) || vibeByTitle.get(item.title) || 'unknown'
}));

document.getElementById('summary').textContent = V0_ITEMS.length.toLocaleString() + ' items · ' + Object.keys(V0_BUCKETS).length + ' original clusters · ' + STYLES.length + ' predicted vibes';

function activeItems() { return mode === 'v0' ? V0_ITEMS : CLUSTER_ITEMS; }
function outerKeys() {
  if (mode === 'v0') return Object.keys(V0_BUCKETS);
  return mode === 'image-text' ? Object.keys(V0_BUCKETS) : styleKeys();
}
function styleKeys() { return [...new Set([...STYLES, ...activeItems().map(item => item.style)])]; }
function styleLabel(key) { return NAMES[STYLES.indexOf(key)] || (key === 'unknown' ? 'Unassigned' : key); }
function hasInner() { return mode === 'image-text' || mode === 'text-image'; }
function innerKeys() { return mode === 'text-image' ? Object.keys(V0_BUCKETS) : styleKeys(); }
function outerOf(it) { return (mode === 'image-text' || mode === 'v0') ? it.bucket : it.style; }
function innerOf(it) { return mode === 'text-image' ? it.bucket : it.style; }

function outerLabel(key) {
  return (mode === 'image-text' || mode === 'v0') ? 'Bucket ' + key : styleLabel(key);
}
function innerLabel(key) {
  return mode === 'text-image' ? 'Bucket ' + key : styleLabel(key);
}
function itemsInOuter(key) {
  return activeItems().filter(it => outerOf(it) === key);
}
function itemsInOuterInner(okey, ikey) {
  return activeItems().filter(it => outerOf(it) === okey && innerOf(it) === ikey);
}

for (const m of MODES) {
  const b = document.createElement('button');
  b.textContent = m.label;
  b.onclick = () => setMode(m.id);
  modeNav.appendChild(b);
}

function setMode(id) {
  mode = id;
  outer = outerKeys()[0];
  inner = hasInner() ? 'all' : null;
  document.getElementById('description').textContent = MODES.find(m => m.id === mode).description;
  modeNav.querySelectorAll('button').forEach((button, index) => {
    const selected = MODES[index].id === mode;
    button.classList.toggle('active', selected);
    button.setAttribute('aria-pressed', String(selected));
  });
  renderOuterNav();
  renderInnerNav();
  renderGrid();
}

function renderOuterNav() {
  outerNav.innerHTML = '';
  for (const key of outerKeys()) {
    const b = document.createElement('button');
    b.innerHTML = outerLabel(key) + '<span class="count">(' + itemsInOuter(key).length + ')</span>';
    b.onclick = () => {
      outerNav.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      outer = key;
      inner = hasInner() ? 'all' : null;
      renderInnerNav();
      renderGrid();
    };
    outerNav.appendChild(b);
  }
  outerNav.children[0].classList.add('active');
}

function renderInnerNav() {
  innerNav.innerHTML = '';
  if (!hasInner()) {
    innerNav.style.display = 'none';
    return;
  }
  innerNav.style.display = 'flex';

  const allBtn = document.createElement('button');
  allBtn.innerHTML = 'All<span class="count">(' + itemsInOuter(outer).length + ')</span>';
  allBtn.onclick = () => {
    innerNav.querySelectorAll('button').forEach(x => x.classList.remove('active'));
    allBtn.classList.add('active');
    inner = 'all';
    renderGrid();
  };
  innerNav.appendChild(allBtn);

  for (const key of innerKeys()) {
    const n = itemsInOuterInner(outer, key).length;
    const b = document.createElement('button');
    b.innerHTML = innerLabel(key) + '<span class="count">(' + n + ')</span>';
    if (n === 0) b.classList.add('empty');
    b.onclick = () => {
      innerNav.querySelectorAll('button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      inner = key;
      renderGrid();
    };
    innerNav.appendChild(b);
  }
  allBtn.classList.add('active');
}

function crumbLabel() {
  let s = MODES.find(m => m.id === mode).label + ' / ' + outerLabel(outer);
  if (hasInner()) s += ' / ' + (inner === 'all' ? 'All' : innerLabel(inner));
  return s;
}

function price(p) {
  const n = parseFloat(p);
  return '$' + (Number.isInteger(n) ? n : n.toFixed(2));
}

function renderGrid() {
  let items;
  if (!hasInner() || inner === 'all') {
    items = itemsInOuter(outer);
  } else {
    items = itemsInOuterInner(outer, inner);
  }

  crumb.textContent = crumbLabel() + ' · ' + items.length + ' of ' + activeItems().length + ' items';
  for (const nav of [outerNav, innerNav]) {
    nav.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button.classList.contains('active'))));
  }
  grid.innerHTML = '';

  if (items.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-msg';
    msg.textContent = 'No items in this combination. Try another filter or select All.';
    grid.appendChild(msg);
    return;
  }

  for (const item of items) {
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = item.image;
    img.loading = 'lazy';
    img.alt = item.title;
    img.addEventListener('error', () => {
      img.removeAttribute('src');
      img.alt = 'Image unavailable: ' + item.title;
    }, { once: true });

    const info = document.createElement('div');
    info.className = 'info';

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = item.title;

    const p = document.createElement('div');
    p.className = 'price';
    p.textContent = mode === 'v0' ? '$' + item.price : price(item.price);

    info.append(title, p);
    card.append(img, info);
    grid.appendChild(card);
  }
}

setMode('image-text');
</script>
